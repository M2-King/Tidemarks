name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Tidemark.xcodeproj -scheme Tidemark -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Tidemark.app

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Tidemark.app
          # Embed the App Group entitlement so signing tools carry it over.
          ldid -SWidget/TidemarkWidget.entitlements "$APP/PlugIns/TidemarkWidget.appex"
          ldid -SApp/Tidemark.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Tidemark.ipa Payload
          ls -lh Tidemark.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Tidemark-ipa
          path: Tidemark.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Save IPA and log to the builds branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          if [ -f Tidemark.ipa ]; then
            cp Tidemark.ipa out/
            unzip -l Tidemark.ipa > out/contents.txt
            plutil -p Payload/Tidemark.app/Info.plist > out/app-info.txt || true
            ldid -e Payload/Tidemark.app/Tidemark > out/app-entitlements.txt || true
            ldid -e Payload/Tidemark.app/PlugIns/TidemarkWidget.appex/TidemarkWidget > out/widget-entitlements.txt || true
          fi
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
